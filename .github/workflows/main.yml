name: Weekly Scraper and Data Update

on:
  schedule:
    - cron: '0 0 * * 1' # Minden hétfőn éjfélkor fut
  workflow_dispatch: # Kézi indítás lehetősége

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd scraper
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Run scraper
      run: |
        cd scraper
        python scraper.py

    - name: Copy data to frontend
      run: |
        mkdir -p frontend/src/data
        cp scraper/data/*.json frontend/src/data/

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automatikus adatfrissítés (Scraper)"
        file_pattern: 'scraper/data/*.json frontend/src/data/*.json'
